[package]
name = "osv-store"
version = "0.1.0"
edition = "2024"

[dependencies]
osv-schema = { path = "../osv-schema" }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "3"
thiserror = "2"
pep440_rs = "0.7"
regex = "1"
semver = "1"
unive_rs = { version = "0.4", default-features = false, features = ["apk", "deb", "rpm", "maven", "nuget", "gem", "cran", "hackage", "opam", "pub", "hex", "brew"] }
url = "2"
percent-encoding = "2"
