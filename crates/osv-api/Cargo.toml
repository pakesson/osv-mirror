[package]
name = "osv-api"
version = "0.1.0"
edition = "2024"

[features]
default = ["client"]
client = ["dep:httpdate", "dep:reqwest", "dep:thiserror", "dep:tokio"]

[dependencies]
base64 = "0.23"
httpdate = { version = "1", optional = true }
osv-schema = { path = "../osv-schema" }
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls", "system-proxy"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { version = "2", optional = true }
tokio = { version = "1", features = ["time"], optional = true }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt"] }
