[package]
name = "osv-schema"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
jsonschema = { version = "0.61", default-features = false, features = ["arbitrary-precision"] }
packageurl = "0.6"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde_path_to_error = "0.1"
thiserror = "2"
